# voereir07: 64 GB host, 36 x 1G hugepages (kernel cmdline), 1 per NUMA node
# for OVS-DPDK, 34 for VMs. Hugepages can't be overcommitted.
[DEFAULT]
reserved_host_memory_mb = 26624
reserved_huge_pages = node:0,size:1GB,count:1
reserved_huge_pages = node:1,size:1GB,count:1
ram_allocation_ratio = 1.0

# CPU split: see globals.yml. 3 cores per NUMA node pinned, 3 cores shared;
# host/control plane and OVS-DPDK PMDs keep 0-2,12-14.
[compute]
cpu_dedicated_set = 6-11,18-23
cpu_shared_set = 3-5,15-17
