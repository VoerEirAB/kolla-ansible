[DEFAULT]
# Keep the CPU overcommit the computes run with.
cpu_allocation_ratio = 8.0
# Do not overcommit RAM, and keep 8 GB for the host (OVS, Ceph OSD, the
# containers). With ram_allocation_ratio = 2.0 and no reserve, Nova booked up
# to twice a host's RAM and voereir09 hung out of memory (October 2026).
ram_allocation_ratio = 1.0
reserved_host_memory_mb = 8192
