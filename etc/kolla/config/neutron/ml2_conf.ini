# voereir07: provider networks.
#  physnet1  = br_dpdk, enp8s0f0 (DPDK): flat, 20.0.0.0/24, OVS-DPDK networks
#  physnet2  = br_ex, eno2 (kernel port): flat, 172.16.227.0/24, external
#  sriovnet1 = SR-IOV VFs on enp8s0f1: VLAN 1000 (30.0.0.0/24)
# Tenant (primary) networks stay VXLAN.
[ml2_type_vlan]
network_vlan_ranges = sriovnet1:1000:1000

[ml2_type_flat]
flat_networks = physnet1,physnet2
