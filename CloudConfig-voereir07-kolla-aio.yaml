#cloud-config
# voereir07: kolla-ansible AIO (OpenStack 2026.2) on Ubuntu 24.04.
# Deployed by MAAS as 22.04 (jammy), then upgraded with do-release-upgrade,
# as MAAS fails to deploy 24.04+ here (LP: #2171042).
# Based on CloudConfig.yaml, with these changes:
#  - no ufw: kolla-ansible bootstrap-servers disables host firewalls
#    (disable_firewall: true), and ufw would block the OpenStack APIs
#  - hostname must not resolve to 127.0.1.1 (breaks RabbitMQ), so cloud-init
#    no longer manages /etc/hosts and that line is removed
#  - host iscsid disabled, as kolla runs its own iscsid container for Cinder LVM
#  - packages for running kolla-ansible from this host
# The "cinder-volumes" LVM volume group is created by MAAS (storage layout).
#
# Aligned with "Authentication & Authorization Setup" (IT space):
#  - no common login user; one account per person
#  - groups (plural): voereir_admins, voereir_users, voereir_visitors
#  - admins: primary group voereir_admins (no per-user group), plus adm, sudo,
#    voereir_users and voereir_visitors
#  - shared directories (singular) /opt/voereir_admin and /opt/voereir_visitor,
#    owned by voereir_admins and voereir_visitors, linked into admin homes
#  - common "voereir" user (in voereir_users) for rootless services, never reachable over SSH
#  - SSH only for recognised users; root, postgres and voereir denied
#  - ufw enabled with SSH allowed

groups:
  - voereir_admins
  - voereir_users
  - voereir_visitors

users:
  - name: safiyat
    gecos: Md Safiyat Reza
    primary_group: voereir_admins
    no_user_group: true
    groups: [adm, sudo, voereir_users, voereir_visitors]
    shell: /bin/bash
    lock_passwd: false
    # 8D
    hashed_passwd: "$6$l0XwyUrFFC0IIrcw$kXolAK481wD22EpVrXX/j1IN4RFhbiiE56niw4aHKKINu2Y.U23pp59DpiV6gWAaN5q/1bvcbk8rBqxksi5b.0"
    ssh_import_id: ["gh:safiyat"]
    # Keys from github.com/safiyat.keys (fetched 2026-10-16), so login works
    # even if ssh_import_id can't reach GitHub at first boot.
    ssh_authorized_keys:
      - ecdsa-sha2-nistp521 AAAAE2VjZHNhLXNoYTItbmlzdHA1MjEAAAAIbmlzdHA1MjEAAACFBAAvBxzAp5K9ZrhjvMwiUjxaQFYVbe9NntQTDCXOufzUi+RQ9GuIgE7oVVh9nSE+lUiaAjBKj3LxH5bJ9OjhgZDqfQFF1nW9oHeAMoZRvKVeJ8zNvErraJT+0dhb908svnw22GfXsDSRQlMxlYP6HSthuLlngVeUIeHGE35GSDuBuQC2bQ== gh:safiyat

  - name: rouf
    primary_group: voereir_admins
    no_user_group: true
    groups: [adm, sudo, voereir_users, voereir_visitors]
    shell: /bin/bash
    lock_passwd: false
    # hashed_passwd: "<mkpasswd -m sha-512 output for rouf>"
    ssh_import_id: ["gh:Rouf111"]
    # Keys from github.com/Rouf111.keys (fetched 2026-10-16), so login works
    # even if ssh_import_id can't reach GitHub at first boot.
    ssh_authorized_keys:
      - ssh-rsa  rouf@mohmads-MacBook-Pro.local

  - name: pranav
    primary_group: voereir_admins
    no_user_group: true
    groups: [adm, sudo, voereir_users, voereir_visitors]
    shell: /bin/bash
    lock_passwd: false
    hashed_passwd: "$6$sX2upFEsUrl81e8v$aGVp1a6i.r904170hFXXZFEU.DIg4U0sOwsBdeZeqINFokdITKMBaALb62N16sLsgC0almd/N4Gyzmzdzw9Mj/"
    ssh_import_id: ["gh:pranav79"]
    # Keys from github.com/pranav79.keys (fetched 2026-10-16), so login works
    # even if ssh_import_id can't reach GitHub at first boot.
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGkcT6rWennbQ0AB291pgwYO2m8XGfndotYc57Yhy+j/ gh:pranav79

  # Common user for rootless services. No password, no SSH (see DenyUsers below).
  - name: voereir
    groups: [voereir_users, voereir_visitors]
    shell: /bin/bash
    lock_passwd: true

# Key-based SSH only; passwords are for sudo and the iDRAC console.
ssh_pwauth: false
disable_root: true

write_files:
  - path: /etc/ssh/sshd_config.d/10-voereir-access.conf
    permissions: "0644"
    content: |
      PermitRootLogin no
      AllowUsers safiyat rouf pranav
      DenyUsers voereir root postgres
  # DNS: MAAS DNS (172.16.227.116) as nameserver, with "voereir.io" and "maas"
  # as search domains (in that order, so short names try voereir.io first).
  # Set globally, so it applies regardless of interface.
  - path: /etc/systemd/resolved.conf.d/voereir.conf
    permissions: "0644"
    content: |
      [Resolve]
      DNS=172.16.227.116
      Domains=voereir.io maas
  # Shell history: timestamps, no duplicates, long history. Appended to the
  # skeleton .bashrc (write_files runs before the users are created), so it
  # comes after, and overrides, Ubuntu's default HISTSIZE/HISTCONTROL.
  - path: /etc/skel/.bashrc
    append: true
    content: |

      # VoerEir: shell history settings
      HISTTIMEFORMAT="%F %T: "
      HISTCONTROL=ignoredups:erasedups
      HISTSIZE=10000
      HISTFILESIZE=200000
  - path: /root/.bashrc
    append: true
    content: |

      # VoerEir: shell history settings
      HISTTIMEFORMAT="%F %T: "
      HISTCONTROL=ignoredups:erasedups
      HISTSIZE=10000
      HISTFILESIZE=200000
  # Login banner from color.logo.txt (ANSI colours). Stored gzip+base64 because
  # YAML can't hold the raw escape characters. Regenerate with:
  #   gzip -9c color.logo.txt | base64 -w0
  - path: /etc/motd
    permissions: "0644"
    encoding: gz+b64
    content: 

runcmd:
  # Shared directories for each group, linked into every admin's home
  - [mkdir, -p, /opt/voereir_admin, /opt/voereir_visitor]
  - [chown, "root:voereir_admins", /opt/voereir_admin]
  - [chown, "root:voereir_visitors", /opt/voereir_visitor]
  - [chmod, "775", /opt/voereir_admin, /opt/voereir_visitor]
  - [sh, -c, 'for u in safiyat rouf pranav; do ln -sfn /opt/voereir_admin /home/$u/voereir_admin; ln -sfn /opt/voereir_visitor /home/$u/voereir_visitor; done']
  - [systemctl, restart, systemd-resolved]
  - [systemctl, restart, ssh]
  # kolla-ansible: hostname must resolve to the API interface, not 127.0.1.1
  - [sed, -i, '/^127\.0\.1\.1[[:space:]]/d', /etc/hosts]
  # kolla-ansible: Cinder LVM uses kolla's iscsid container, not the host's
  - [sh, -c, 'systemctl disable --now iscsid.socket iscsid.service || true']

package_update: true
packages:
  - vim
  - nethogs
  # kolla-ansible deployment host
  - git
  - python3-dev
  - python3-venv
  - libffi-dev
  - gcc
  - libssl-dev
  # dbus-python, built by bootstrap-servers in the kolla runtime venv
  - libdbus-glib-1-dev
  - pkg-config
  # kolla ovs-dpdk role: ovs-dpdkctl.sh keeps its config with crudini
  - crudini
  # Cinder LVM backend
  - lvm2
  - thin-provisioning-tools

timezone: Asia/Kolkata

manage_etc_hosts: false
